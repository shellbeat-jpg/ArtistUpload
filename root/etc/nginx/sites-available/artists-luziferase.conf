# --- 1. PORT 80: Weiterleitung auf HTTPS & Sicherheitsblöcke ---
server {
    listen 80;
    listen [::]:80;
    
    # Fängt die Hauptdomain artists.luziferase.de UND jede direkte Subdomain (z.B. bass.luziferase.de) ab
    # Ignoriert dabei die azuracast.luziferase.de Domain, da diese in einer eigenen Conf liegt
    # server_name artists.luziferase.de ~^(?!azuracast)(?<station_stub>.+)\.luziferase\.de$;
    server_name artists.luziferase.de ~^(?!azuracast)(?<station_stub>[^.]+)\.luziferase\.de$;
    
    # Block IPs & User-Agents
    if ($blocked_ip) { return 403; }
    if ($blocked_agent) { return 403; }

    location ~ (wp-content|\.php$|xyn\.php) {
        return 403;
    }       
    
    return 301 https://$host$request_uri;
}

# --- 2. PORT 443: Sicheres HTTPS & Dynamischer Reverse Proxy ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # Regex extrahiert den Namen (z.B. "bass" aus "bass.luziferase.de") in die Variable $station_stub
    # server_name artists.luziferase.de ~^(?!azuracast)(?<station_stub>.+)\.luziferase\.de$;
    server_name artists.luziferase.de ~^(?!azuracast)(?<station_stub>[^.]+)\.luziferase\.de$;
    
    client_max_body_size 500M;
    
    ssl_certificate /etc/letsencrypt/live/luziferase.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luziferase.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($blocked_ip) { return 403; }
    if ($blocked_agent) { return 403; }

    location ^~ /public/ {
        # Falls Hauptdomain, weiter an Node
        if ($host = "artists.luziferase.de") {
            proxy_pass http://127.0.0.1:3500;
            break;
        }
    
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host azuracast.luziferase.de;
        proxy_set_header Referer "https://azuracast.luziferase.de";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/adminer(\.php)? {
        root /opt/artist-upload/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /opt/artist-upload/public/adminer.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "display_errors=On\nerror_reporting=E_ALL";
    }

    # Reicht das stationsspezifische CSS direkt an den AzuraCast-Player weiter     
    location = /css/stations/style.css {
        alias /opt/artist-upload/public/css/stations/$station_stub.css;
        access_log off;
        add_header Content-Type text/css;
    }

    location = /public/sw.js {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host azuracast.luziferase.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 2.1 PLAYER-ROUTING: Wenn NUR die nackte Subdomain aufgerufen wird
    location = / {
        # Wenn die Hauptdomain artists.luziferase.de aufgerufen wird, an Node übergeben
        if ($host = "artists.luziferase.de") {
            proxy_pass http://127.0.0.1:3500;
            break;
        }
        
        # Internes Umschreiben auf die korrekte AzuraCast-Medien-URI
        rewrite ^/$ /public/$station_stub break;
        
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host azuracast.luziferase.de;
        proxy_set_header Referer "https://luziferase.de";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 2.1b ASSET-ROUTING: Fängt alle statischen AzuraCast-Ressourcen ab
    # Verhindert, dass CSS/JS-Anfragen fälschlicherweise bei deiner Node-App landen!
    location ~* ^/(static|assets|api|api/shortcode)/ {
        # Wenn der Aufruf über die Stammdomain erfolgt, normal an Node übergeben
        if ($host = "artists.luziferase.de") {
            proxy_pass http://127.0.0.1:3500;
            break;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host azuracast.luziferase.de;
        proxy_set_header Referer "https://azuracast.luziferase.de";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 2.2 APP-ROUTING: Alle Pfade wie /artist/... oder /admin/... gehen an deine Node-App
    location / {             
        proxy_pass http://127.0.0.1:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Übergibt den extrahierten Sendernamen (z.B. "bass") an Node
        proxy_set_header X-Station-Stub $station_stub;
    }  
    
}
