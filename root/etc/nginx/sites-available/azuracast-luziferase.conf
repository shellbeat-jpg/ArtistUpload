server {
    server_name azuracast.luziferase.de stream.luziferase.de luziferase.de;
    
    # Block IPs
    if ($blocked_ip) {
        return 403;
    }        
    # Block User-Agents
    if ($blocked_agent) {
        return 403;
    }
    # Block Pfade
    location ~ (wp-content|\.php$|xyn\.php) {
        return 403;
    }
    
    # Artist-Portal API via gleiche Host-Domain
    # (Express auf :3500)
    location = /public/station-message {
        proxy_pass http://127.0.0.1:3500/public/station-message;
        add_header X-Debug-Location station-message always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }  
    # Optional: Slash-Variante sauber umleiten
    location = /public/station-message/ {
        return 301 /public/station-message$is_args$args;
    } 
 
    # Block Pfade
    location ~ (wp-content|\.php$|xyn\.php) {
        return 403;
    }
    
    # Station CSS Override
    location = /css/stations/style.css {
        alias /opt/artist-upload/public/css/stations/luziferase.css;
        access_log off;
        add_header Content-Type text/css;
    }
    
    # Stream-Endpunkte robuster
    location ^~ /listen/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Default -> AzuraCast
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        client_max_body_size 500M;
    }   

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/luziferase.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/luziferase.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


}

server {

    # Block IPs
    if ($blocked_ip) {
        return 403;
    }
    
    # Block User-Agents
    if ($blocked_agent) {
        return 403;
    }
    
    # Block Pfade
    location ~ (wp-content|\.php$|xyn\.php) {
        return 403;
    }


    if ($host = luziferase.de) {
        return 301 https://$host$request_uri;
    }
    if ($host = stream.luziferase.de) {
        return 301 https://$host$request_uri;
    }
    if ($host = azuracast.luziferase.de) {
        return 301 https://$host$request_uri;
    }
        
    client_max_body_size 500M;
    
    listen 80;
    server_name azuracast.luziferase.de stream.luziferase.de luziferase.de;
    return 404;
}